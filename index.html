<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f14">
<title>Access Terminal</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --well: #0a0e13; --line: #233041;
    --text: #e6edf3; --muted: #8b98a8; --accent: #3ddc97; --bad: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; min-height: 100svh;
    display: flex; flex-direction: column; gap: 18px; }
  .tag { font: 600 12px var(--mono); letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
  h1 { margin: 4px 0 2px; font-size: 26px; line-height: 1.2; }
  .intro { margin: 0; color: var(--muted); }
  .progress { display: flex; gap: 6px; margin-top: 14px; }
  .progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .progress span.done { background: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .stage { font: 600 12px var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 10px; }
  .q { white-space: pre-wrap; font-size: 18px; margin: 0 0 14px; }
  .code { font: 16px/1.5 var(--mono); background: var(--well); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; margin: 0 0 16px; white-space: pre-wrap; word-break: break-all; user-select: all; }
  .pic { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
  .small { font-size: 13px; color: var(--muted); margin: 6px 0 14px; }
  .label { font: 600 12px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input { font: 18px var(--mono); padding: 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--well); color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: 600 17px system-ui, sans-serif; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: #04120b; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 24px; margin: 4px 0 0; font-size: 15px; }
  .msg.bad { color: var(--bad); }
  .msg.good { color: var(--accent); }
  details { margin-top: 14px; color: var(--muted); font-size: 15px; }
  summary { cursor: pointer; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .granted { text-align: center; }
  .granted .big { font: 700 22px var(--mono); color: var(--accent); letter-spacing: .1em; margin: 0 0 6px; }
  .letters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
  .letters span { font: 700 40px var(--mono); width: 62px; height: 76px; display: grid; place-items: center;
    border: 2px solid var(--accent); border-radius: 10px; color: var(--accent); background: var(--well);
    animation: pop .45s both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
  .reset { background: none; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 6px; }
  noscript { color: var(--bad); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="tag" id="tag"></div>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>
  <section class="card" id="card" aria-live="polite"></section>
  <noscript>Please enable JavaScript to play.</noscript>
</main>

<script>
const CONFIG = {"id":"9a30988c87c3","title":"Access Terminal","tag":"ACCT // Checkpoint","intro":"Solve the challenge and submit the flag to reveal your letters.","total":1,"iter":200000,"first":{"question":"Find the StarHub and M1 networking equipment in CityLink Mall. Their labels look like these examples, but the numbers (such as 01 and 51) differ from box to box. The X and Y characters are the same on every box:\n\n• StarHub: ISA35-B1-01-XXXXXX\n• M1: RAFFLES LINK-B1/51 YYYYYYY\n\nKey: XXXXXX followed by YYYYYYY (13 characters), in uppercase, with no spaces.\n\nDecrypt the flag (ML-KEM-512 as in FIPS 203, then AES-256-GCM):\n\n1. seed = SHAKE-256 of the key (UTF-8), first 64 bytes.\n2. Derive the ML-KEM-512 key pair from seed (d = first 32 bytes, z = last 32 bytes).\n3. Decapsulate KEM with the decapsulation key to get a 32-byte shared secret.\n4. AES-256-GCM-decrypt CT using the shared secret as the key, with NONCE and TAG, and no associated data.","code":"","codes":[{"label":"KEM","text":"375504494bfc3719b31a52e406bdcf60f6c343ded9fdc25f75cba6782e6ede65b5931810e603c5e62f6e1a90aa36d77d595f044418778c94b5b83b8829cc6a0a8cd65c4a3007b2c027eaa3618efc6757c96746f15f8fec448684d283691e70be91b645e911ce8405fadfef2f6e537a934ea16a6a584aa1ee082acc5a8fb4ea0d3672f4909f638f722fa31952ad52b6c825f2e33c6ae71c0bc06e1ba6ba15df1e67e246f535b108cbac29ead1a6fd038182431de135dab9bef52974a2b132a3353a40d7551f4df2a01b69fb96740fd8a352c542acde1d2cbb4e7fd5249f5cb6f4cd14a42e553b3fcbd817b264a9a9764d03dc344c69475a572ff0c959fc7aa275195fa33b7c91406c41a7b232e2e8bcdee3dd56be68cea1b385a344653651c30d1ea36eb09300c01af4ad2853bc72c957296808c2592d43f6010005eec1abd789fca1bbeb433a83fe7c714747a91bdbee0993c5245da71bd4dba7deeceb8786af0851880b8cf2bc6943840a4ff1d265b9a349232bf4014ec401db7c966a86356111e138787add0fc461f1ddc37f19e1bc13df58a00c2e10d665eeb1e0e3ee2b0423828eb9eeb1d6e987d83efab077c4ab36294f4feb23fd071f3611e441c169341b67c76896bfba2185fe8a6db865a91c5194720eb754347e5a30ecc7f432ba215b796454d5c6dc2b85f93eff53f77d0d7e3c0d473951e7e12245e5388151bd9035841f2cb87a2c13c1df791d87eaed63020c4f23f9ecfda0ff6b9f12a970f61ef86364143661812167257c652e1aedd1b603b750aa0c41b32d3869b3d406612e59b00687c12f4b16bae5662866ec98a885f06d676e5b13942cfb2d5c4cfa9a3151179895b422ff0760ec7f5e7eff15202d1bfb47d337b223b797bb0594fccb7eca90b4a527c0879c9f676bc6fca1eb1f6ac29a58144e524173fa7f4204c8594609ca7af397d7a3363b7640a704f669a8c2aba0358888639f8f3941e26d454e308ed9d4788af9734808d2b9fab2776e14b16f647d59b37e9e59ea9f881910f5c49124ea3cb908df0eb827dbe82c459910586cbedaa56bdc079c2a96a41cebd453"},{"label":"NONCE","text":"472b15f2b48419630ded0370"},{"label":"CT","text":"4a81fa12da1cd6eb6757ecaf14f9f30cf8200e0f1958b5598f711925"},{"label":"TAG","text":"97d156abc960bc3f21296fe04d7850a7"}],"image":"","imageAlt":"","placeholder":"ACCT{...}","hint":"Python's kyber-py package implements ML-KEM-512 exactly as in FIPS 203.","lock":{"s":"0CCJwg6lYQ4gWJUX4xRdNw==","boxes":[{"i":"r3HoF4Oc5bg0tB2o","c":"NYwfcgLIFsk2gHlMqp3BQX27zZqAeTN4LZQy41dX7LamO6RiNAMMUng3DCVDPapBsVsUoRWNZ9YbNdGaCvAdhpjWGJ8hAmE1J/bt2O1CEnMmAoc5wFM7HBfoVBKNhv4="},{"i":"sgBeQZus9w5bTRSf","c":"EvUyClQEYzlNLgFdn+Ynki6d+KPWejgrf64wwCK/pnR+y5OnhB0M1D+XHsVdoaPof6La9RBPqXMhopMoVJOjgWCywzSECZ8NRGGpFsM/2+gaVpEwfJvaQGubNlakVbQ="}]}}};

const enc = new TextEncoder(), dec = new TextDecoder();
const norm = s => String(s).normalize("NFKC").toUpperCase().replace(/[^A-Z0-9]/g, "");
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SAVE_KEY = "qr-challenge:" + CONFIG.id;

async function tryLock(answer, lock) {
  const base = await crypto.subtle.importKey("raw", enc.encode(norm(answer)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: unb64(lock.s), iterations: CONFIG.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const box of lock.boxes) {
    try {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.i) }, key, unb64(box.c));
      return JSON.parse(dec.decode(pt));
    } catch (_) { /* not this one */ }
  }
  throw new Error("wrong");
}

const $ = id => document.getElementById(id);
let stageNo = 0, current = CONFIG.first, solved = [];

function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; } catch (_) { return []; } }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(solved)); } catch (_) {} }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function drawProgress() {
  const p = $("progress"); p.innerHTML = "";
  for (let i = 0; i < CONFIG.total; i++) { const s = el("span"); if (i < stageNo) s.className = "done"; p.append(s); }
}

function renderStage(note) {
  drawProgress();
  const card = $("card"); card.innerHTML = "";
  if (CONFIG.total > 1) card.append(el("p", "stage", `Lock ${stageNo + 1} of ${CONFIG.total}`));
  card.append(el("p", "q", current.question));
  if (current.image) {
    const a = el("a"); a.href = current.image; a.target = "_blank"; a.rel = "noopener";
    const img = el("img", "pic"); img.src = current.image; img.alt = current.imageAlt || "Challenge image";
    a.append(img); card.append(a, el("p", "small", "Tap the image to open it full size or download it."));
  }
  for (const c of current.codes || []) {
    if (c.label) card.append(el("p", "label", c.label));
    card.append(el("pre", "code", c.text));
  }
  if (current.code) card.append(el("pre", "code", current.code));

  const form = el("form");
  const input = el("input");
  Object.assign(input, { type: "text", name: "answer", placeholder: current.placeholder || "Your answer", autocomplete: "off",
    spellcheck: false, required: true });
  input.setAttribute("autocapitalize", "characters");
  input.setAttribute("autocorrect", "off");
  input.setAttribute("enterkeyhint", "go");
  input.setAttribute("aria-label", "Your answer");
  const btn = el("button", null, "Submit");
  btn.type = "submit";
  const msg = el("p", "msg" + (note ? " good" : ""), note || "");
  form.append(input, btn, msg);
  card.append(form);

  if (current.hint) {
    const d = el("details"); d.append(el("summary", null, "Need a hint?"), el("p", null, current.hint));
    card.append(d);
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const answer = input.value;
    if (!norm(answer)) return;
    btn.disabled = true; btn.textContent = "Checking…"; msg.className = "msg"; msg.textContent = "";
    try {
      const next = await tryLock(answer, current.lock);
      solved.push(answer); save();
      advance(next, "✓ Correct! Next lock unlocked.");
    } catch (_) {
      btn.disabled = false; btn.textContent = "Submit";
      msg.className = "msg bad"; msg.textContent = "✗ Access denied. That's not it. Try again!";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      if (navigator.vibrate) navigator.vibrate(120);
      input.select();
    }
  });
  if (stageNo > 0) input.focus();
}

function renderGranted(final) {
  stageNo = CONFIG.total; drawProgress();
  const card = $("card"); card.innerHTML = ""; card.className = "card granted";
  card.append(el("p", "big", "ACCESS GRANTED"), el("p", "intro", "Your letters:"));
  const row = el("div", "letters");
  [...final.letters.replace(/\s+/g, "")].forEach((ch, i) => {
    const s = el("span", null, ch); s.style.animationDelay = (0.15 + i * 0.18) + "s"; row.append(s);
  });
  card.append(row);
  if (final.success) card.append(el("p", null, final.success));
  const again = el("button", "reset", "Start over");
  again.addEventListener("click", () => { clearSave(); location.reload(); });
  card.append(again);
}

function advance(next, note) {
  stageNo++;
  if ("letters" in next) renderGranted(next);
  else { current = next; renderStage(note); }
}

(async function init() {
  $("tag").textContent = CONFIG.tag || "";
  $("title").textContent = CONFIG.title || "";
  $("intro").textContent = CONFIG.intro || "";
  if (CONFIG.title) document.title = CONFIG.title;
  if (!window.crypto || !crypto.subtle) {
    $("card").textContent = "This page needs a secure (https) connection. Please open it from the QR code link.";
    return;
  }
  // Restore progress if the phone reloaded the page.
  for (const a of load()) {
    try { const next = await tryLock(a, current.lock); solved.push(a); stageNo++;
      if ("letters" in next) return renderGranted(next); current = next; }
    catch (_) { clearSave(); break; }
  }
  renderStage();
})();
</script>
</body>
</html>
